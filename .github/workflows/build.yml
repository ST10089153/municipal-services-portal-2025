name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/MunicipalServicesReporting.Tests --configuration Release

  build-app:
    name: Build WinForms app (.NET Framework 4.7.2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild MunicipalServicesReporting.csproj /p:Configuration=Release /nologo /v:minimal
